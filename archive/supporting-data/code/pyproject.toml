[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cedar-m2"
version = "0.1.0"
description = "M2 pilot infrastructure for measuring epistemic costs of activation capping"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate==1.10.1",
    "huggingface-hub==0.35.0",
    "numpy>=2.1,<3",
    "pandas>=2.3,<3",
    "pyarrow>=17,<22",
    "pyyaml>=6,<7",
    "protobuf>=5.29,<7",
    "scikit-learn>=1.5,<2",
    "sentencepiece>=0.2,<0.3",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<1",
    "torch==2.6.0",
    "tqdm>=4.66,<5",
    "transformers==4.56.1",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1,<4",
    "pytest>=8.3,<9",
    "ruff>=0.13,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cedar_m2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
