# ACL-exp-b1 configuration (white-box localisation, Qwen3 no_think). Frozen with PROTOCOL.md.
experiment_id: "ACL-exp-b1"
depends_on: "ACL-exp-a1 protocol v2.2 (prompts rendered by experiments/ACL-exp-a1/scripts/render_prompts.py)"
pairs_file: "data/b1_pairs_v2_2.jsonl"       # built by scripts/b1_build_pairs.py (CPU)

models:
  - {alias: "qwen3_8b",  repo: "Qwen/Qwen3-8B",  gpus: 1, order: 1}
  - {alias: "qwen3_14b", repo: "Qwen/Qwen3-14B", gpus: 2, order: 2, notes: "device_map=auto over 2 x A800 40G"}
device_map: "auto"

# Contrasts run by default. C_content_CF / C_ctx_shell are DEFERRED: run only with --include-deferred after the
# A1 v2.2 2x2 gate (results/v2_2/summary_tables/v22_2x2_placebo_hard.json ->
# decision_c_content_localisable_on_context_flip == true for this model).
contrasts: ["C_soc", "C_form", "C_Fshell", "C_content_AF", "C_content_N"]

min_effect_logits: 0.5          # pairs with |m(clean) - m(corrupt)| below this are excluded from ratio metrics
atp_kinds: ["head", "mlp"]      # add "neuron" for MLP-neuron AtP (memory ~ n_suffix x 12288 x n_layers floats)
report_top: 30

resid_per_position_pairs: 8
resid_per_position_layer_stride: 4

verify_on_half: "A"             # top-k selected on half B, recovery measured on half A (no double dipping)
verify_k_heads: [5, 10, 20, 50]
verify_k_mlp_layers: [1, 3, 5]
n_random_seeds: 5

reliability_k: [10, 20, 50]

dissociation_contrasts: ["C_soc", "C_form", "C_content_AF", "C_content_N"]
dissociation_k: 20
dissociation_max_pairs: 60

# Pre-registered read-outs (see PROTOCOL.md §5)
preregistered:
  signal_present: "stage_sanity: median effect > 0 and sign consistency >= 0.70 (per contrast)"
  localisation_valid: "stage_verify: top-k recovery CI lower bound > max(random layer-matched) for k in {10,20}"
  reliable: "stage_reliability: within-contrast split-half Jaccard@20 > across-contrast Jaccard@20"
  double_dissociation: >-
    stage_dissociation: recovery[X][X] > recovery[X][Y] + 0.2 AND recovery[Y][Y] > recovery[Y][X] + 0.2
    for (X, Y) = (C_soc, C_form); same test for (C_form, C_content_AF) and (C_soc, C_content_N).
